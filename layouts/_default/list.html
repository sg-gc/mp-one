<!DOCTYPE html>
<html lang="en-US">
    <head>
        {{ partial "meta.html" . }}
    </head>
    <body>
        <header>
            <h1>{{.Site.Title}}</h1>
            {{ partial "menu.html" }}
        </header>
        <main>
            <h2>{{.Title}}</h2>
            {{.Content}}
            <ul>
                {{range .Pages}}
                <li><a href="{{.RelPermalink}}">{{.Title}}</a></li>
                {{end}}
            </ul>
        </main>
        <footer>
            {{partial "footer.html" .}}
        </footer>
    </body>
</html>
